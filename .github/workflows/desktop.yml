name: Dentiva Desktop (Windows & macOS)

# Membangun installer Tauri:
#   - Windows: .exe (NSIS) + .msi
#   - macOS:   .dmg universal (Intel + Apple Silicon)
#
# Dua cara jalan:
#   1. Uji (Run workflow manual / push branch console): installer di tab Artifacts halaman run.
#   2. RILIS + pembaruan otomatis: naikkan versi di apps/desktop/package.json, lalu push tag
#      desktop-v<versi> (mis. desktop-v1.11.0). Installer + latest.json bertanda tangan terbit di
#      repo PUBLIK Reza-grd/dentiva-desktop-releases; aplikasi yang terpasang menawarkan pembaruan.
#
# Variabel repository (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (publishable key), VITE_PUBLIC_APP_URL,
#   VITE_SENTRY_DSN (opsional).
# Secrets untuk rilis (Settings → Secrets and variables → Actions → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — kunci penanda tangan pembaruan
#   RELEASES_TOKEN — fine-grained token, akses Contents: Read & write HANYA ke repo dentiva-desktop-releases
# Tanda tangan kode (menyusul; tanpa ini installer tetap jadi, tetapi SmartScreen/Gatekeeper memberi peringatan):
#   macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: sertifikat code-signing / Azure Trusted Signing

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    # Uji build otomatis saat berkas desktop berubah
    branches: ['console']
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_OWNER: Reza-grd
  RELEASE_REPO: dentiva-desktop-releases
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}

jobs:
  # Rilis saja: periksa versi, kunci & token, lalu buat draft rilis di repo publik.
  prepare:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa versi, kunci publik & secrets
        id: check
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="${GITHUB_REF_NAME#desktop-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) tidak sama dengan versi apps/desktop/package.json ($version)."; exit 1
          fi
          if grep -q 'GANTI_DENGAN_KUNCI_PUBLIK_UPDATER' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::Kunci publik updater belum diisi di tauri.conf.json (plugins.updater.pubkey)."; exit 1
          fi
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Secrets TAURI_SIGNING_PRIVATE_KEY / RELEASES_TOKEN belum diisi."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Buat draft rilis di repo publik
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const tag = `v${{ steps.check.outputs.version }}`;
            const { data } = await github.rest.repos.createRelease({
              owner: process.env.RELEASE_OWNER, repo: process.env.RELEASE_REPO,
              tag_name: tag, name: `Dentiva ${tag}`, draft: true,
              body: 'Pembaruan aplikasi desktop Dentiva. Aplikasi yang sudah terpasang akan menawarkan pembaruan ini secara otomatis.',
            });
            return data.id;

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    # Tetap jalan untuk build uji (prepare dilewati), berhenti bila prepare gagal.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: macOS (universal)
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Periksa konfigurasi Supabase
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Variabel VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY belum diisi — installer uji tidak akan bisa login."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      # Build uji: hanya artefak, tanpa tanda tangan pembaruan
      - uses: tauri-apps/tauri-action@v0
        if: env.IS_RELEASE != 'true'
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      # Rilis: installer + .sig + latest.json ke repo publik dentiva-desktop-releases
      - uses: tauri-apps/tauri-action@v0
        if: env.IS_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Simpan installer sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg

  # Rilis: setelah Windows & macOS selesai, terbitkan rilis → jadi "latest" yang dicek aplikasi.
  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: process.env.RELEASE_OWNER, repo: process.env.RELEASE_REPO,
              release_id: Number('${{ needs.prepare.outputs.release_id }}'), draft: false, make_latest: 'true',
            });
