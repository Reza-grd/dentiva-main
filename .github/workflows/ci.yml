name: Dentiva CI

on:
  push:
    branches: [main, master, console]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test & build (clinic + console)
    runs-on: ubuntu-latest
    env:
      # Nilai palsu hanya untuk build; aplikasi tidak memanggil Supabase saat build.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (packages + console)
        run: npm run typecheck

      - name: Unit tests (clinic, shared, console, console-api)
        run: npm test

      - name: Migration smoke test (PGlite, tanpa Docker)
        run: npm run db:smoke

      - name: Denti Agen — uji fungsi database pada skema produksi (PGlite)
        run: npm run db:agent

      - name: Audit log tambah-saja & berantai hash — uji pada skema produksi (PGlite)
        run: npm run db:audit
      - name: Uji kunci login bertingkat (PGlite)
        run: npm run db:kunci-login
      - name: Uji migrasi data pasien lewat Console (PGlite)
        run: npm run db:migrasi-pasien
      - name: Uji recall berbasis SOP perawatan (PGlite)
        run: npm run db:recall
      - name: Uji kode klinik untuk identitas pesan WA (PGlite)
        run: npm run db:kode-klinik

      - name: Denti Agen — evaluasi percakapan (skrip, tanpa jaringan) + uji penilai
        run: |
          npm run eval:agen:selftest
          npm run eval:agen:negative

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (Deno)
        run: bash scripts/check-edge-functions.sh

      - name: Deno unit tests
        run: deno test --config supabase/functions/ai-assistant/deno.json supabase/functions/ai-assistant/ supabase/functions/_shared/ supabase/functions/midtrans-webhook/

      - name: Build clinic
        run: npm run build:clinic

      - name: Build console
        run: npm run build:console

  database:
    name: Migration & RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.101.0

      - name: Run pgTAP tests
        run: bash scripts/test-database-ci.sh

  edge-functions:
    name: Deno check (console-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Type-check console-api
        working-directory: supabase/functions/console-api
        run: deno check index.ts

  # OWASP A03 (rantai pasok): paket produksi tanpa kerentanan tinggi/kritis + tidak ada rahasia di commit.
  keamanan:
    name: Keamanan (npm audit + pemindai rahasia)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: npm audit (dependensi produksi, gagal bila ada tingkat tinggi/kritis)
        run: npm audit --omit=dev --audit-level=high

      - name: Pindai rahasia (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
