# Override khusus Dentiva (dipasang lewat COMPOSE_FILE di .env).
# Docker menembus firewall ufw untuk port yang dipublikasikan, jadi semua port internal
# dikunci ke 127.0.0.1 — hanya bisa diakses dari server itu sendiri / terowongan SSH.
# HTTPS publik hanya lewat Caddy (docker-compose.caddy.yml) setelah DNS api.dentiva.id siap.
services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  # Studio TIDAK dibuka ke internet. Akses lewat: ssh -L 3000:127.0.0.1:3000 dentiva@<IP>
  studio:
    ports:
      - "127.0.0.1:3000:3000"

  # Keamanan akun (GoTrue): MFA TOTP aktif (pengguna mendaftarkan sendiri; pemaksaan peran dilakukan di database setelah UI siap),
  # kebijakan sandi sesuai yang dijanjikan UI (min. 8, huruf + angka) dan penolakan sandi yang pernah bocor (k-anonymity, gagal-terbuka).
  auth:
    environment:
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "5"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_PASSWORD_HIBP_ENABLED: "true"
      # CAPTCHA Turnstile (login, daftar, lupa password). Nilai di .env, diatur lewat /opt/dentiva/bin/atur-captcha.sh;
      # bawaan mati. Permintaan service role (fungsi edge) tidak diperiksa CAPTCHA.
      GOTRUE_SECURITY_CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: turnstile
      GOTRUE_SECURITY_CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      GOTRUE_SECURITY_CAPTCHA_TIMEOUT: 10s
      # Batas per IP bawaan GoTrue (login/refresh 150 per 5 menit, verifikasi 30 per 5 menit) memakai IP asli pengunjung.
      # Caddy mengganti X-Forwarded-For kiriman klien (tidak bisa dipalsukan, diuji 22 Nov 2026); nilai pertama = IP klien.
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      # Kunci akun bertingkat (5→1 mnt, 10→5 mnt, 15→30 mnt, 20→24 jam) untuk password & kode MFA —
      # migrasi 20261122130000_kunci_login_bertingkat.sql; catatan di keamanan.kejadian.
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/hook_password_verification_attempt
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/hook_mfa_verification_attempt

  # Edge function: rahasia & konfigurasi Dentiva di functions.env (izin 600, diisi lewat
  # /opt/dentiva/bin/isi-rahasia-functions.sh). Router (volumes/functions/main) memeriksa JWT
  # per fungsi; webhook pihak ketiga dikecualikan seperti verify_jwt = false di Supabase Cloud.
  functions:
    env_file:
      - path: ./functions.env
        required: false
    environment:
      FUNCTIONS_NO_VERIFY_JWT: whatsapp-webhook,midtrans-webhook

  # Sidecar WhatsApp Dentiva (tidak resmi, WhatsApp Web asli via whatsapp-web.js + Chromium) — kode di
  # infra/vps/wa-sidecar, dipasang ke
  # /opt/dentiva/wa-sidecar. TIDAK ada port publik: edge function memanggil http://wa-sidecar:3000
  # dengan WA_SIDECAR_KEY (wa-sidecar.env & functions.env, izin 600). Kunci sesi WhatsApp di
  # volumes/wa-sidecar (izin 700). Login: docker exec -it dentiva-wa node cli.mjs login
  wa-sidecar:
    container_name: dentiva-wa
    hostname: dentiva-wa # tetap, agar kunci profil Chromium tidak dianggap milik "komputer lain"
    profiles: ["wa-sidecar"] # hanya jalan bila diminta: docker compose --profile wa-sidecar up -d wa-sidecar
    build: /opt/dentiva/wa-sidecar
    image: dentiva/wa-sidecar:local
    restart: unless-stopped
    env_file:
      - path: ./wa-sidecar.env
        required: false
    environment:
      WWEB_DIR: /data/wwebjs
    volumes:
      - ./volumes/wa-sidecar:/data
    # Hanya 127.0.0.1 (halaman QR lewat terowongan SSH: ssh -L 3002:127.0.0.1:3002 …).
    ports:
      - "127.0.0.1:3002:3000"
    mem_limit: 1536m
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
